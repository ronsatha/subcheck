    <script>
    (function(){try{var t=localStorage.getItem('subcheck_theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');}}catch(e){}
    document.addEventListener('DOMContentLoaded',function(){
      var nav=document.querySelector('nav'); if(!nav) return;
      var wrap=nav.querySelector('.justify-between')||nav.querySelector('div'); if(!wrap) return;
      var b=document.createElement('button');
      b.type='button'; b.setAttribute('aria-label','Toggle dark mode'); b.title='Toggle dark mode';
      b.className='w-9 h-9 shrink-0 flex items-center justify-center rounded-lg border border-gray-200 dark:border-gray-600 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:text-brand transition text-base';
      function paint(){b.textContent=document.documentElement.classList.contains('dark')?'\u2600':'\u263E';}
      paint();
      b.addEventListener('click',function(){var d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('subcheck_theme',d?'dark':'light');}catch(e){} paint();});
      wrap.appendChild(b);
    });})();
    </script>
